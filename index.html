<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTL Scoreboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .score-card {
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            border: 2px solid #334155;
        }
        .score-title {
            font-size: 18px;
            color: #94a3b8;
        }
        .score-value {
            font-size: 64px;
            font-weight: bold;
            color: #4ade80;
            margin: 10px 0;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        button.btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.btn:active {
            transform: scale(0.95);
        }
        button.btn-add { background: #22c55e; }
        button.btn-sub { background: #ef4444; }
        button.btn-reset { background: #64748b; grid-column: span 3; }
    </style>
</head>
<body>

    <div class="container">
        <h1>محمد طلحه لیگ (MTL) اسکور بورڈ</h1>
        
        <div class="score-card">
            <div class="score-title">موجودہ اسکور</div>
            <div id="scoreDisplay" class="score-value">0</div>
        </div>

        <div class="controls">
            <button class="btn btn-add" onclick="updateScore(1)">+1</button>
            <button class="btn btn-add" onclick="updateScore(2)">+2</button>
            <button class="btn btn-add" onclick="updateScore(4)">+4</button>
            <button class="btn btn-add" onclick="updateScore(6)">+6</button>
            <button class="btn btn-sub" onclick="updateScore(-1)">-1</button>
            <button class="btn btn-reset" onclick="resetScore()">صفر کریں (Reset)</button>
        </div>
    </div>

    <!-- Firebase SDKs aur Real-time Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-analytics.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        // آپ کی فائر بیس کنفیگریشن
        const firebaseConfig = {
            apiKey: "AIzaSyDzPCvAcuWcl6tuw8N-jQiJHFzvLPxXloc",
            authDomain: "mtl-score-borad.firebaseapp.com",
            projectId: "mtl-score-borad",
            storageBucket: "mtl-score-borad.firebasestorage.app",
            messagingSenderId: "630349741535",
            appId: "1:630349741535:web:eb17e1bd794da27efed86a",
            measurementId: "G-8Z7Q8PB71R"
        };

        // فائر بیس انیشلائز کریں
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // فائر اسٹور کا راستہ (Collection: score, Document: core)
        const docRef = doc(db, "score", "core");

        // رئیل ٹائم سنک (Real-time listener) تاکہ دوسرے موبائل سے کنٹرول ہوسکے
        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById("scoreDisplay").innerText = data.Score;
            } else {
                setDoc(docRef, { Score: 0 });
            }
        });

        // اسکور اپ ڈیٹ کرنے کا فنکشن (Global scope کے لیے window کے ساتھ منسلک کیا گیا ہے)
        window.updateScore = async function(amount) {
            try {
                const snap = await getDoc(docRef);
                let currentScore = 0;
                if (snap.exists()) {
                    currentScore = snap.data().Score || 0;
                }
                let newScore = currentScore + amount;
                if (newScore < 0) newScore = 0; // اسکور منفی میں نہ جائے

                await updateDoc(docRef, { Score: newScore });
            } catch (error) {
                console.error("اسکور اپ ڈیٹ کرنے میں خرابی: ", error);
            }
        };

        // اسکور ری سیٹ کرنے کا فنکشن
        window.resetScore = async function() {
            try {
                await updateDoc(docRef, { Score: 0 });
            } catch (error) {
                console.error("ری سیٹ کرنے میں خرابی: ", error);
            }
        };
    </script>
</body>
</html>
