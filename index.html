<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TM Live Stream Pro</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; color: #4f46e5; margin-bottom: 10px; }
        .box {
            background: #2d2d2d;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #444;
        }
        video {
            width: 100%;
            height: 200px;
            background: #000;
            border-radius: 6px;
            margin-top: 8px;
            object-fit: cover;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 6px;
            border: none;
            font-size: 15px;
            box-sizing: border-box;
        }
        input { background: #333; color: #fff; border: 1px solid #555; }
        button { font-weight: bold; cursor: pointer; }
        .btn-start { background: #4f46e5; color: white; }
        .btn-connect { background: #10b981; color: white; }
        .id-display {
            background: #111;
            padding: 10px;
            text-align: center;
            font-family: monospace;
            color: #f43f5e;
            font-size: 16px;
            border-radius: 4px;
            margin-top: 5px;
            word-break: break-all;
        }
        #status { text-align: center; font-size: 13px; color: #aaa; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>TM Live Cam</h2>
    <div id="status">Connecting to network...</div>

    <!-- Mobile 1: Camera Sender -->
    <div class="box">
        <h3>1. Apna Camera Chalu Karein</h3>
        <button class="btn-start" onclick="startMyCamera()">Camera On Karein</button>
        <video id="localVideo" autoplay playsinline muted></video>
        <p style="font-size: 12px; margin: 8px 0 2px 0; color: #aaa;">Yeh ID dusre mobile par lagانی hai:</p>
        <div class="id-display" id="myIdBox">Wait karein...</div>
    </div>

    <!-- Mobile 2: Stream Viewer -->
    <div class="box">
        <h3>2. Doosre ka Stream Dekhein</h3>
        <input type="text" id="targetIdInput" placeholder="Pehle mobile ki ID yahan likhein">
        <button class="btn-connect" onclick="connectToStream()">Stream Dekhein</button>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>
</div>

<script>
    let peer;
    let localStream;
    let currentCall;

    const statusEl = document.getElementById('status');
    const myIdBox = document.getElementById('myIdBox');

    // Initialize Peer safely with public servers
    function initPeer() {
        peer = new Peer({
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' }
                ]
            }
        });

        peer.on('open', (id) => {
            myIdBox.innerText = id;
            statusEl.innerText = "Connected! Ready to stream.";
            statusEl.style.color = "#10b981";
        });

        peer.on('error', (err) => {
            console.error(err);
            statusEl.innerText = "Connection Error: " + err.type;
            statusEl.style.color = "#f43f5e";
        });

        // Jab koi doosra call kare
        peer.on('call', (call) => {
            if (!localStream) {
                alert("Pehle aapko apna camera on karna hoga!");
                return;
            }
            call.answer(localStream);
            call.on('stream', (remoteStream) => {
                document.getElementById('remoteVideo').srcObject = remoteStream;
                statusEl.innerText = "Live Stream Connected!";
            });
        });
    }

    // Camera on karne ka function
    async function startMyCamera() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: 1280, height: 720 }, 
                audio: true 
            });
            document.getElementById('localVideo').srcObject = localStream;
            alert("Camera successfully chalu ho gaya hai!");
        } catch (err) {
            alert("Camera ki ijazat nahi mili: " + err);
        }
    }

    // Doosre mobile se connect karne ka function
    function connectToStream() {
        const targetId = document.getElementById('targetIdInput').value.trim();
        if (!targetId) {
            alert("Barah-e-karam pehle mobile ki ID yahan darj karein!");
            return;
        }

        if (!localStream) {
            // Agar caller ke paas stream nahi hai toh pehle blank stream ya request bhejenge
            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
                localStream = stream;
                document.getElementById('localVideo').srcObject = localStream;
                makeTheCall(targetId);
            }).catch(() => {
                makeTheCall(targetId);
            });
        } else {
            makeTheCall(targetId);
        }
    }

    function makeTheCall(targetId) {
        statusEl.innerText = "Connecting...";
        const call = peer.call(targetId, localStream);
        
        call.on('stream', (remoteStream) => {
            document.getElementById('remoteVideo').srcObject = remoteStream;
            statusEl.innerText = "Connected! Stream chal rahi hai.";
            statusEl.style.color = "#10b981";
        });

        call.on('error', (err) => {
            alert("Call error: " + err);
        });
    }

    // Run on load
    initPeer();
</script>

</body>
</html>
