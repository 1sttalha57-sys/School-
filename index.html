<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Camera Stream</title>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        video {
            width: 100%;
            max-height: 300px;
            background: #000;
            border-radius: 4px;
            margin-top: 10px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .stream-btn {
            background-color: #007bff;
        }
        .stream-btn:hover {
            background-color: #0056b3;
        }
        #my-id {
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Mobile Camera Streamer</h2>
    <p>Aap ki ID: <span id="my-id">Generating...</span></p>

    <!-- Camera On Section (First Mobile) -->
    <div>
        <h3>1. Camera On Karen</h3>
        <button onclick="startCamera()">Camera On Karen</button>
        <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <hr style="margin: 20px 0;">

    <!-- Stream View Section (Second Mobile) -->
    <div>
        <h3>2. Stream Dekhen</h3>
        <input type="text" id="remoteIdInput" placeholder="Pehle mobile ki ID yahan likhein">
        <button class="stream-btn" onclick="connectToPeer()">Stream Dekhen</button>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>
</div>

<script>
    let localStream;
    let peer;
    let myPeerId;

    // PeerJS initialization
    peer = new Peer();

    peer.on('open', (id) => {
        myPeerId = id;
        document.getElementById('my-id').innerText = id;
    });

    // 1. Camera On karne ka function
    async function startCamera() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;
            alert("Camera on ho gaya hai! Ab yeh ID dusre mobile mein darj karein: " + myPeerId);
        } catch (error) {
            alert("Camera access karne mein masla hai: " + error);
        }
    }

    // Dusre mobile ki call ko accept karne ke liye
    peer.on('call', (call) => {
        call.answer(localStream); // Apna camera stream wapas bhejen agar zaroorat ho
        call.on('stream', (remoteStream) => {
            document.getElementById('remoteVideo').srcObject = remoteStream;
        });
    });

    // 2. Stream dekhne ke liye connect karne ka function
    function connectToPeer() {
        const remoteId = document.getElementById('remoteIdInput').value;
        if (!remoteId) {
            alert("Barah-e-karam pehle mobile ki ID likhein!");
            return;
        }

        // Khali stream ke sath call initiate karein taaki samne wale ka camera dekh sakein
        const call = peer.call(remoteId, new MediaStream());
        call.on('stream', (remoteStream) => {
            document.getElementById('remoteVideo').srcObject = remoteStream;
        });
        call.on('error', (err) => {
            alert("Connection error: " + err);
        });
    }
</script>

</body>
</html>
