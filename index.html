<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TM Mobile CCTV System</title>
    <!-- PeerJS Library -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #1e293b;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 5px; }
        .status { text-align: center; font-size: 13px; color: #94a3b8; margin-bottom: 15px; }
        .box {
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }
        h3 { margin-top: 0; font-size: 15px; color: #cbd5e1; }
        video {
            width: 100%;
            height: 200px;
            background: #000;
            border-radius: 8px;
            margin-top: 10px;
            object-fit: cover;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }
        input { background: #1e293b; color: #fff; border: 1px solid #475569; }
        button { font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-cam { background: #4f46e5; color: white; }
        .btn-cam:hover { background: #4338ca; }
        .btn-connect { background: #10b981; color: white; }
        .btn-connect:hover { background: #059669; }
        .id-box {
            background: #1e293b;
            padding: 10px;
            text-align: center;
            font-family: monospace;
            color: #f43f5e;
            font-size: 16px;
            border-radius: 6px;
            margin-top: 5px;
            border: 1px dashed #475569;
            user-select: all;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📷 TM CCTV Live</h2>
    <div class="status" id="connectionStatus">Server se connect ho raha hai...</div>

    <!-- Dukaan wala mobile (Camera Sender) -->
    <div class="box">
        <h3>1. Dukaan Wala Mobile (Camera)</h3>
        <p style="font-size: 12px; color: #94a3b8; margin: 0;">Yeh ID ap apne paas wale mobile me likhenge:</p>
        <div class="id-box" id="myPeerId">Generating ID...</div>
        <button class="btn-cam" onclick="startShopCamera()">Dukaan Ka Camera On Karein</button>
        <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <!-- Aapke apne paas wala mobile (CCTV Viewer) -->
    <div class="box">
        <h3>2. Aap Ke Paas Wala Mobile (Viewer)</h3>
        <input type="text" id="shopIdInput" placeholder="Dukaan wale mobile ki ID yahan daalein">
        <button class="btn-connect" onclick="watchCCTV()">CCTV Live Dekhein</button>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>
</div>

<script>
    let peer;
    let localStream;
    let currentCall;

    const statusEl = document.getElementById('connectionStatus');
    const myPeerIdEl = document.getElementById('myPeerId');

    // Public STUN servers taaki internet par connection block na ho
    const peerOptions = {
        config: {
            'iceServers': [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' }
            ]
        }
    };

    // Peer initialize karein
    peer = new Peer(peerOptions);

    peer.on('open', (id) => {
        myPeerIdEl.innerText = id;
        statusEl.innerText = "Status: Connected to Server (Ready)";
        statusEl.style.color = "#10b981";
    });

    peer.on('error', (err) => {
        statusEl.innerText = "Error: " + err.type;
        statusEl.style.color = "#f43f5e";
    });

    // 1. Dukaan wale mobile ka camera start karna
    async function startShopCamera() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment' }, // Pichla camera (Back camera) jo dukaan dekhega
                audio: true 
            });
            document.getElementById('localVideo').srcObject = localStream;
            alert("Dukaan ka camera kamyaabi se on ho gaya hai! Ab yeh ID apne paas wale mobile me likhein.");
        } catch (err) {
            alert("Camera ki ijazat nahi mili: " + err);
        }
    }

    // Jab apne paas wale mobile se call aaye gi, tou dukaan wala mobile khud-ba-خود stream bhej dega
    peer.on('call', (call) => {
        if (!localStream) {
            alert("Pehle dukaan wale mobile par camera on karein!");
            return;
        }
        call.answer(localStream); // Camera ki live stream call karne wale ko bhej dein
        call.on('stream', (remoteStream) => {
            // Agar zaroorat ho
        });
        statusEl.innerText = "Status: CCTV Live Streaming Active!";
        statusEl.style.color = "#10b981";
    });

    // 2. Aapke apne paas wale mobile se CCTV live dekhne ka function
    function watchCCTV() {
        const shopId = document.getElementById('shopIdInput').value.trim();
        if (!shopId) {
            alert("Barah-e-karam dukaan wale mobile ki ID yahan likhein!");
            return;
        }

        statusEl.innerText = "CCTV connect ho raha hai...";

        // Caller ke liye khali stream ya media stream banana zaroori hota hai
        navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
            makeCCTVCall(shopId, stream);
        }).catch(() => {
            // Agarmic/cam permission na bhi ho tab bhi call karne ki koshish karein
            makeCCTVCall(shopId, new MediaStream());
        });
    }

    function makeCCTVCall(shopId, stream) {
        const call = peer.call(shopId, stream);

        call.on('stream', (remoteStream) => {
            // Dukaan ke camera ki live video yahan show hogi!
            document.getElementById('remoteVideo').srcObject = remoteStream;
            statusEl.innerText = "Status: CCTV Live Connected! (Aap dukaan dekh rahe hain)";
            statusEl.style.color = "#10b981";
        });

        call.on('error', (err) => {
            alert("Connection error: " + err);
        });
    }
</script>

</body>
</html>
